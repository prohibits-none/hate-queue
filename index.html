<style>

;border:1px solid var(--line);box-shadow:var(--shadow)}.quick-card{padding:16px;min-height:115px;cursor:pointer;transition:transform .16s,border-color .16s}.quick-card:hover,.feature-card:hover{transform:translateY(-2px);border-color:#b8a99b}.quick-card .card-icon{font-size:19px;color:var(--accent)}.quick-card h3{margin:12px 0 5px;font-size:13px}.quick-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.home-columns{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel{padding:19px}.panel h3{font:500 18px var(--serif);margin:0 0 5px}.panel .sub{font-size:11px;color:var(--muted);margin:0 0 16px}.game-feature{background:#28332d;color:#f4f0e8;border:0;min-height:180px;display:flex;justify-content:space-between;align-items:end;position:relative;overflow:hidden}.game-feature:after{content:'♟';font-size:150px;position:absolute;right:25px;top:-5px;color:#526155}.game-feature>*{position:relative;z-index:1}.game-feature .eyebrow{color:#c0a18c}.game-feature h3{font-size:25px}.game-feature p{max-width:260px;color:#d0d0c5;font-size:12px;line-height:1.5}.game-feature .button{background:#f4f0e8;color:#28332d;border-color:#f4f0e8}.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.feature-card{padding:16px;position:relative;min-height:125px;cursor:pointer;transition:.16s}.feature-card h3{font-size:14px;margin:10px 0 5px}.feature-card p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.feature-card .tag{font:9px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}.favorite{position:absolute;right:12px;top:12px;background:transparent;border:0;font-size:16px;color:#a5a194;padding:2px}.favorite.on{color:var(--accent)}.page-title{font:500 38px var(--serif);margin:6px 0 8px;letter-spacing:-.03em}.page-intro{color:var(--muted);margin:0 0 25px;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:15px 0}.field{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:10px 11px;min-height:38px}.field:focus{border-color:var(--accent)}input.field,textarea.field{width:100%}textarea.field{min-height:125px;resize:vertical;line-height:1.55}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.result{padding:12px;background:#efede5;border-left:2px solid var(--green);margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px var(--mono)}.error{border-color:var(--accent);color:var(--accent)}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.todo-row,.recent-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.todo-row:last-child,.recent-row:last-child{border:0}.todo-row span{flex:1}.todo-row.done span{text-decoration:line-through;color:var(--muted)}.delete-btn{border:0;background:none;color:var(--muted)}.game-board{display:grid;gap:7px;max-width:360px;margin:18px auto}.ttt-board{grid-template-columns:repeat(3,1fr)}.ttt-cell{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);font:40px var(--serif);color:var(--accent)}.ttt-cell:hover{background:#eee9df}.game-status{text-align:center;font:16px var(--serif);margin:12px}.number-display{font:50px var(--serif);text-align:center;color:var(--accent);padding:15px}.tool-search{width:min(100%,420px)}.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:12px 17px;z-index:20;box-shadow:var(--shadow);animation:appear .2s}.modal-backdrop{position:fixed;inset:0;background:#17181266;display:grid;place-items:start center;padding:15vh 16px 20px;z-index:10}.modal{width:min(540px,100%);background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px #0003;padding:20px}.modal input{width:100%}.search-results{margin-top:10px;max-height:55vh;overflow:auto}.search-result{display:flex;justify-content:space-between;padding:12px 9px;border-bottom:1px solid var(--line);cursor:pointer}.search-result:hover{background:#eee9df}.result-cat{color:var(--muted);font-size:11px}.footer{border-top:1px solid var(--line);padding:18px 0;margin-top:45px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}.mobile-menu{display:none}
body.dark{--paper:#20221f;--panel:#282a26;--ink:#eee9dd;--muted:#aaa99e;--line:#41423b;--accent:#ca8b7c;--accent-soft:#3a302c;--green:#9bad8e;--shadow:0 12px 30px #0002}body.dark .topbar{background:var(--panel)}body.dark .hero{background:#30332d;border-color:#41433b}body.dark .hero:after{color:#383b34}body.dark .hero p,body.dark .page-intro{color:#c0bfb5}body.dark .nav-item:hover,body.dark .nav-item.active,body.dark .search-result:hover{background:#363831}body.dark .result{background:#30332d}body.dark .game-feature{background:#19231d}body.dark .game-feature .button{background:var(--paper);color:#28332d}

@media(max-width:650px){.topbar{height:60px;padding:0 14px;gap:12px}.brand{min-width:0}.brand-sub,.global-search{display:none}.mobile-menu{display:inline-block}.layout{display:block}.sidebar{display:none;position:fixed;top:60px;bottom:0;left:0;width:250px;background:var(--panel);z-index:8;overflow:auto;box-shadow:10px 0 30px #0001}.sidebar.open{display:block}.top-actions{gap:5px}.top-actions .icon-btn{height:34px;min-width:34px}.brand-name{font-size:14px}main{padding:25px 16px 35px}.hero{padding:26px 22px;min-height:260px}.hero:after{right:-14%;font-size:245px;top:3px}.hero-copy{max-width:100%}.hero p{max-width:90%}.home-columns{grid-template-columns:1fr}.tool-grid{grid-template-columns:1fr 1fr}.section-head{margin-top:27px}.page-title{font-size:32px}.form-grid{grid-template-columns:1fr}.footer{gap:8px;flex-direction:column}}
@media(max-width:380px){.tool-grid{grid-template-columns:1fr}.quick-grid{gap:8px}.quick-card{padding:12px}.topbar{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
<header class="topbar">
 <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Open navigation">☰</button>
 <div class="brand"><div class="brand-mark" aria-hidden="true">O</div><div><div class="brand-name">OBSIDIAN</div><div class="brand-sub">THE DIGITAL PLAYGROUND</div></div></div>
 <div class="global-search"><span class="search-icon">⌕</span><input id="searchInput" aria-label="Search features" placeholder="Search tools, games, and more…"><span class="shortcut">Ctrl K</span></div>
 <div class="top-actions"><button class="icon-btn" id="searchOpen" aria-label="Open search">⌕</button><button class="icon-btn" id="themeToggle" aria-label="Toggle dark theme">◐</button><button class="icon-btn" id="favoritesBtn" aria-label="Favorites">☆</button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar" aria-label="Main navigation">
 <div class="nav-label">Workspace</div>
 <button class="nav-item active" data-view="overview"><span class="ico">⌂</span>Overview</button>
 <button class="nav-item" data-view="arcade"><span class="ico">♟</span>Arcade</button>
 <button class="nav-item" data-view="calculators"><span class="ico">＋</span>Calculators</button>
 <button class="nav-item" data-view="everyday"><span class="ico">◷</span>Everyday tools</button>
 <button class="nav-item" data-view="developer"><span class="ico">⌘</span>Developer tools</button>
 <button class="nav-item" data-view="productivity"><span class="ico">☷</span>Productivity</button>
 <button class="nav-item" data-view="text"><span class="ico">¶</span>Text studio</button>
 <button class="nav-item" data-view="converters"><span class="ico">⇄</span>Converters</button>
 <div class="nav-label">Your library</div>
 <button class="nav-item" data-view="favorites"><span class="ico">☆</span>Favorites</button>
 <button class="nav-item" data-view="recent"><span class="ico">↺</span>Recently used</button>
 <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>
 <div class="side-bottom">A small collection of useful things.<br>Made for the curious.</div>
</aside>
<main id="main" tabindex="-1"></main>
</div>
</div>
<div id="overlay"></div><div id="live" aria-live="polite" class="sr-only"></div>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const safeStore={get(k,fallback){try{const v=localStorage.getItem('obsidian.'+k);return v===null?fallback:JSON.parse(v)}catch{return fallback}},set(k,v){try{localStorage.setItem('obsidian.'+k,JSON.stringify(v));return true}catch{return false}}};

const catalog=[
 {id:'calculator',name:'Standard calculator',category:'Calculators',desc:'A clean four-function calculator.',icon:'＋',view:'calculators',keywords:'math arithmetic'},
 {id:'scientific',name:'Scientific calculator',category:'Calculators',desc:'Evaluate common scientific expressions.',icon:'∑',view:'calculators',keywords:'math trig'},
 {id:'percentage',name:'Percentage calculator',category:'Calculators',desc:'Find a percentage or percentage change.',icon:'%',view:'calculators',keywords:'discount percent'},
 {id:'tic-tac-toe',name:'Tic-Tac-Toe',category:'Arcade',desc:'A thoughtful little game for two players.',icon:'×',view:'arcade',keywords:'game noughts crosses'},
 {id:'number-guess',name:'Number guessing',category:'Arcade',desc:'Find the hidden number in fewer guesses.',icon:'?',view:'arcade',keywords:'game puzzle'},
 {id:'rps',name:'Rock Paper Scissors',category:'Arcade',desc:'A quick match against the computer.',icon:'✦',view:'arcade',keywords:'game'},
 {id:'memory-match',name:'Memory Match',category:'Arcade',desc:'Find all the matching pairs.',icon:'▦',view:'arcade',keywords:'game memory cards'},
 {id:'hangman',name:'Word Guess',category:'Arcade',desc:'Guess the hidden word before you run out of turns.',icon:'Aa',view:'arcade',keywords:'game word hangman'},
 {id:'coin-flip',name:'Coin Flip',category:'Arcade',desc:'Call heads or tails and flip a coin.',icon:'◉',view:'arcade',keywords:'game luck'},
 {id:'dice-duel',name:'Dice Duel',category:'Arcade',desc:'Roll against the computer and race to five wins.',icon:'⚄',view:'arcade',keywords:'game dice'},
 {id:'higher-lower',name:'Higher or Lower',category:'Arcade',desc:'Find the hidden number with higher-or-lower clues.',icon:'↑',view:'arcade',keywords:'game number puzzle'},
 {id:'quick-math',name:'Quick Math',category:'Arcade',desc:'Solve quick sums and build your score.',icon:'∑',view:'arcade',keywords:'game math quiz'},
 {id:'color-match',name:'Color Match',category:'Arcade',desc:'Choose the color named on screen.',icon:'◈',view:'arcade',keywords:'game color'},
 {id:'sequence-memory',name:'Sequence Memory',category:'Arcade',desc:'Repeat an ever-growing sequence of symbols.',icon:'▦',view:'arcade',keywords:'game memory pattern'},
 {id:'word-scramble',name:'Word Scramble',category:'Arcade',desc:'Unscramble a mixed-up word.',icon:'Aa',view:'arcade',keywords:'game word puzzle'},
 {id:'reaction-test',name:'Reaction Test',category:'Arcade',desc:'Click as soon as the signal appears.',icon:'⚡',view:'arcade',keywords:'game speed reflex'},
 {id:'odd-one-out',name:'Odd One Out',category:'Arcade',desc:'Spot the symbol that does not belong.',icon:'◇',view:'arcade',keywords:'game puzzle visual'},
 {id:'typing-sprint',name:'Typing Sprint',category:'Arcade',desc:'Type a phrase accurately before time runs out.',icon:'⌨',view:'arcade',keywords:'game typing speed'},
 {id:'word-counter',name:'Word counter',category:'Text Studio',desc:'Count words, characters, and reading time.',icon:'¶',view:'text',keywords:'text writing'},
 {id:'case-converter',name:'Case converter',category:'Text Studio',desc:'Transform text between common cases.',icon:'Aa',view:'text',keywords:'text uppercase lowercase'},
 {id:'json',name:'JSON formatter',category:'Developer Tools',desc:'Validate, pretty-print, or compact JSON.',icon:'{}',view:'developer',keywords:'code format validate minify'},
 {id:'base64',name:'Base64 encoder',category:'Developer Tools',desc:'Encode or decode UTF-8 text locally.',icon:'⇄',view:'developer',keywords:'code encode decode'},
 {id:'uuid',name:'UUID generator',category:'Developer Tools',desc:'Generate a random UUID.',icon:'◈',view:'developer',keywords:'code identifier'},
 {id:'todo',name:'To-do list',category:'Productivity',desc:'Keep a simple list of things to do.',icon:'☷',view:'productivity',keywords:'tasks checklist'},
 {id:'notes',name:'Quick notes',category:'Productivity',desc:'Write and keep a private local note.',icon:'✎',view:'productivity',keywords:'memo writing'},
 {id:'clock',name:'Live clock',category:'Everyday Tools',desc:'Local time, updating every second.',icon:'◷',view:'everyday',keywords:'time date'},
 {id:'timer',name:'Countdown timer',category:'Everyday Tools',desc:'Set a timer that runs in this page.',icon:'◴',view:'everyday',keywords:'time countdown'},
 {id:'converter',name:'Unit converter',category:'Converters',desc:'Convert common length, mass, and temperature units.',icon:'⇄',view:'converters',keywords:'measure units'}
];
let favorites=safeStore.get('favorites',[]),recent=safeStore.get('recent',[]),theme=safeStore.get('theme','light'), activeView='overview', game={};
const main=$('#main');
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);$('#live').textContent=msg;setTimeout(()=>el.remove(),2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTheme(){document.body.classList.toggle('dark',theme==='dark');$('#themeToggle').textContent=theme==='dark'?'☼':'◐';safeStore.set('theme',theme)}
function featureCard(f){return `<article class="feature-card" data-feature="${f.id}" tabindex="0"><button class="favorite ${favorites.includes(f.id)?'on':''}" data-fav="${f.id}" aria-label="${favorites.includes(f.id)?'Remove from':'Add to'} favorites">${favorites.includes(f.id)?'★':'☆'}</button><span class="tag">${esc(f.category)}</span><h3>${f.icon} &nbsp;${esc(f.name)}</h3><p>${esc(f.desc)}</p></article>`}
function openFeature(id){const f=catalog.find(x=>x.id===id);if(!f)return;recent=[id,...recent.filter(x=>x!==id)].slice(0,8);safeStore.set('recent',recent);navigate(f.view,id)}
function navigate(view,feature){activeView=view;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#sidebar').classList.remove('open');render(view,feature);main.focus({preventScroll:true})}
function heading(title,desc){return `<div class="eyebrow">Obsidian / ${esc(title)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-intro">${esc(desc)}</p>`}
function render(view,feature){
 if(view==='overview')return home();
 if(view==='arcade')return arcade(feature);
 if(view==='calculators')return calculators(feature);
 if(view==='everyday')return everyday(feature);
 if(view==='developer')return developer(feature);
 if(view==='productivity')return productivity(feature);
 if(view==='text')return textStudio(feature);
 if(view==='converters')return converters(feature);
 if(view==='favorites')return listing('Favorites',favorites,'Your saved shortcuts, gathered in one place.');
 if(view==='recent')return listing('Recently used',recent,'Pick up where you left off.');
 if(view==='settings')return settings();
}
function home(){main.innerHTML=`<section class="view"><div class="hero"><div class="hero-copy"><div class="eyebrow">A desktop for everyday curiosity</div><h1>Make room for<br>the useful & delightful.</h1><p>A considered collection of tools, small games, and quiet moments of focus — all in one place.</p><button class="button" data-go="everyday">Explore the collection&nbsp; →</button></div></div><div class="section-head"><div><div class="eyebrow">A good place to begin</div><h2>Quick access</h2></div><button class="text-link" data-go="settings">Personalize workspace</button></div><div class="quick-grid">${['calculator','todo','word-counter','json'].map(id=>{let f=catalog.find(x=>x.id===id);return `<article class="quick-card" data-feature="${id}" tabindex="0"><div class="card-icon">${f.icon}</div><h3>${f.name}</h3><p>${f.desc}</p></article>`}).join('')}</div><div class="section-head"><div><div class="eyebrow">A little play</div><h2>Arcade, at your pace</h2></div><button class="text-link" data-go="arcade">Visit arcade →</button></div><div class="panel game-feature"><div><div class="eyebrow">Two-player classic</div><h3>Tic-Tac-Toe</h3><p>Take turns, plan a move ahead, and see who claims the grid.</p><button class="button" data-feature="tic-tac-toe">Play a round&nbsp; →</button></div></div><div class="section-head"><div><div class="eyebrow">Picked for you</div><h2>Popular utilities</h2></div><button class="text-link" data-go="everyday">Browse all</button></div><div class="tool-grid">${catalog.filter(f=>['timer','percentage','base64'].includes(f.id)).map(featureCard).join('')}</div><div class="section-head"><div><div class="eyebrow">Your workspace</div><h2>Continue where you left off</h2></div></div>${recent.length?`<div class="panel">${recent.slice(0,4).map(id=>{let f=catalog.find(x=>x.id===id);return f?`<div class="recent-row"><span>${f.icon}</span><span style="flex:1">${esc(f.name)}</span><button class="text-link" data-feature="${id}">Open →</button></div>`:''}).join('')}</div>`:`<div class="empty">Your recent tools will appear here as you use them.</div>`}<div class="footer"><span>OBSIDIAN · VERSION 1.0</span><span>Your work stays in this browser. Clearing browser data may remove it.</span></div></section>`}

async function copy(s){try{await navigator.clipboard.writeText(s);toast('Copied to clipboard')}catch{toast('Clipboard unavailable — select and copy the text')}}
function developer(feature){let f=feature||'json';main.innerHTML=`<section class="view">${heading('Developer tools','A few dependable utilities that work entirely on your device.')}<div class="tool-grid">${catalog.filter(x=>x.category==='Developer Tools').map(featureCard).join('')}</div><div class="panel" style="margin-top:18px" id="devPanel"></div></section>`;let p=$('#devPanel');if(f==='uuid'){p.innerHTML=`<h3>UUID generator</h3><p class="sub">Generated locally. Uses the browser cryptographic API when available.</p><div class="toolbar"><button class="button" id="makeUuid">Generate UUID</button><button class="button secondary" id="copyUuid">Copy</button></div><div class="result" id="uuidResult">Click Generate UUID.</div>`;$('#makeUuid').onclick=()=>$('#uuidResult').textContent=crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));$('#copyUuid').onclick=()=>copy($('#uuidResult').textContent)}else if(f==='base64'){p.innerHTML=`<h3>Base64 text encoder</h3><p class="sub">UTF-8 text is encoded or decoded locally. Base64 is not encryption.</p><textarea class="field" id="baseInput" placeholder="Text or Base64…"></textarea><div class="toolbar"><button class="button" id="encode64">Encode</button><button class="button secondary" id="decode64">Decode</button><button class="button secondary" id="copyDev">Copy output</button></div><textarea class="field" id="baseOutput" readonly placeholder="Result…"></textarea><div class="game-status error" id="devError"></div>`;$('#encode64').onclick=()=>{try{$('#baseOutput').value=btoa(unescape(encodeURIComponent($('#baseInput').value)));$('#devError').textContent=''}catch{$('#devError').textContent='Could not encode this text.'}};$('#decode64').onclick=()=>{try{$('#baseOutput').value=decodeURIComponent(escape(atob($('#baseInput').value.trim())));$('#devError').textContent=''}catch{$('#devError').textContent='That is not valid Base64-encoded UTF-8 text.'}};$('#copyDev').onclick=()=>copy($('#baseOutput').value)}else{p.innerHTML=`<h3>JSON formatter</h3><p class="sub">Validate, pretty-print, or compact JSON. Input is processed locally.</p><textarea class="field" id="jsonInput" placeholder='{"hello":"world"}'></textarea><div class="toolbar"><button class="button" id="prettyJson">Format</button><button class="button secondary" id="minJson">Minify</button><button class="button secondary" id="copyJson">Copy output</button></div><textarea class="field" id="jsonOutput" readonly placeholder="Formatted JSON…"></textarea><div class="game-status error" id="jsonError"></div>`;const run=compact=>{try{let value=JSON.parse($('#jsonInput').value);$('#jsonOutput').value=JSON.stringify(value,null,compact?0:2);$('#jsonError').textContent='Valid JSON.';$('#jsonError').classList.remove('error')}catch(e){$('#jsonError').textContent='Invalid JSON: '+e.message;$('#jsonError').classList.add('error')}};$('#prettyJson').onclick=()=>run(false);$('#minJson').onclick=()=>run(true);$('#copyJson').onclick=()=>copy($('#jsonOutput').value)}}
function productivity(feature){let f=feature||'todo';main.innerHTML=`<section class="view">${heading('Productivity','Lightweight personal tools. Your entries are stored in this browser only.')}<div class="toolbar"><button class="button ${f==='todo'?'':'secondary'}" data-prod="todo">To-do list</button><button class="button ${f==='notes'?'':'secondary'}" data-prod="notes">Quick notes</button></div><div class="panel" id="productPanel"></div></section>`;$$('[data-prod]').forEach(b=>b.onclick=()=>productivity(b.dataset.prod));let p=$('#productPanel');if(f==='notes'){let note=safeStore.get('notes','');p.innerHTML=`<h3>Quick notes</h3><p class="sub">Autosaved on this device. Do not store passwords or sensitive information here.</p><textarea class="field" id="notesArea" placeholder="A thought to keep…" style="min-height:250px">${esc(note)}</textarea><div class="toolbar"><span class="muted" id="saveState">Saved locally</span><button class="button secondary" id="clearNotes">Clear notes</button></div>`;$('#notesArea').oninput=()=>{safeStore.set('notes',$('#notesArea').value);$('#saveState').textContent='Saved locally'};$('#clearNotes').onclick=()=>{if(confirm('Clear all notes?')){$('#notesArea').value='';safeStore.set('notes','');toast('Notes cleared')}}}else{p.innerHTML=`<h3>To-do list</h3><p class="sub">A simple list saved in your browser.</p><form class="toolbar" id="todoForm"><input class="field" id="todoInput" placeholder="Add a task…" required style="flex:1"><button class="button">Add task</button></form><div id="todoList"></div><div class="toolbar"><button class="button secondary" id="clearDone">Clear completed</button></div>`;let todos=safeStore.get('todos',[]);const draw=()=>{$('#todoList').innerHTML=todos.length?todos.map((t,i)=>`<div class="todo-row ${t.done?'done':''}"><input type="checkbox" data-check="${i}" ${t.done?'checked':''} aria-label="Complete ${esc(t.text)}"><span>${esc(t.text)}</span><button class="delete-btn" data-del="${i}" aria-label="Delete ${esc(t.text)}">×</button></div>`).join(''):'<div class="empty">No tasks yet. Add one above to get started.</div>';$$('[data-check]').forEach(x=>x.onchange=()=>{todos[+x.dataset.check].done=x.checked;save()});$$('[data-del]').forEach(x=>x.onclick=()=>{todos.splice(+x.dataset.del,1);save()})};const save=()=>{safeStore.set('todos',todos);draw()};$('#todoForm').onsubmit=e=>{e.preventDefault();let v=$('#todoInput').value.trim();if(v){todos.push({text:v,done:false});$('#todoInput').value='';save()}};$('#clearDone').onclick=()=>{todos=todos.filter(x=>!x.done);save()};draw()}}
function converters(feature){main.innerHTML=`<section class="view">${heading('Converters','Straightforward unit conversions with familiar reference units.')}<div class="panel"><h3>Length, mass & temperature</h3><p class="sub">Length and mass use standard metric factors. Temperature uses exact scale formulas.</p><div class="form-grid"><div class="form-group"><label for="convertValue">Value</label><input class="field" type="number" id="convertValue" value="1"></div><div class="form-group"><label for="convertType">Conversion</label><select class="field" id="convertType"><option value="m-ft">Meters → feet</option><option value="ft-m">Feet → meters</option><option value="km-mi">Kilometers → miles</option><option value="mi-km">Miles → kilometers</option><option value="kg-lb">Kilograms → pounds</option><option value="lb-kg">Pounds → kilograms</option><option value="c-f">Celsius → Fahrenheit</option><option value="f-c">Fahrenheit → Celsius</option></select></div></div><div class="toolbar"><button class="button" id="convertNow">Convert</button></div><div class="result" id="convertResult">1 m = 3.28084 ft</div></div></section>`;const run=()=>{let v=Number($('#convertValue').value),type=$('#convertType').value;if($('#convertValue').value===''||!Number.isFinite(v))return $('#convertResult').textContent='Enter a valid number.';let factors={'m-ft':[3.280839895,'m','ft'],'ft-m':[.3048,'ft','m'],'km-mi':[.6213711922,'km','mi'],'mi-km':[1.609344,'mi','km'],'kg-lb':[2.2046226218,'kg','lb'],'lb-kg':[.45359237,'lb','kg']};let out,from,to;if(type==='c-f'){out=v*9/5+32;from='°C';to='°F'}else if(type==='f-c'){out=(v-32)*5/9;from='°F';to='°C'}else{[out,from,to]=[v*factors[type][0],...factors[type].slice(1)]}$('#convertResult').textContent=`${fmt(v)} ${from} = ${fmt(out)} ${to}`};$('#convertNow').onclick=run;run()}
function settings(){main.innerHTML=`<section class="view">${heading('Settings','A few ways to make this workspace yours.')}<div class="panel"><h3>Appearance</h3><p class="sub">Theme preference is stored locally in this browser.</p><div class="toolbar"><button class="button ${theme==='light'?'':'secondary'}" data-theme="light">Light theme</button><button class="button ${theme==='dark'?'':'secondary'}" data-theme="dark">Dark theme</button><button class="button secondary" id="exportData">Export local data</button><button class="button secondary" id="resetData">Reset saved data</button></div><p class="muted" style="line-height:1.7">Your notes, tasks, favorites, and theme stay on this device. Clearing browser storage can remove them. This application does not sync data across devices.</p></div><div class="panel" style="margin-top:14px"><h3>Keyboard shortcuts</h3><div class="recent-row"><span style="flex:1">Open global search</span><kbd>Ctrl / ⌘ + K</kbd></div><div class="recent-row"><span style="flex:1">Close search</span><kbd>Escape</kbd></div></div></section>`;$$('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;setTheme();settings()});$('#exportData').onclick=()=>{let obj={version:1,theme,favorites,recent,todos:safeStore.get('todos',[]),notes:safeStore.get('notes','')},blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='obsidian-local-data.json';a.click();URL.revokeObjectURL(a.href);toast('Export created')};$('#resetData').onclick=()=>{if(!confirm('Reset saved Obsidian data in this browser?'))return;try{Object.keys(localStorage).filter(k=>k.startsWith('obsidian.')).forEach(k=>localStorage.removeItem(k))}catch{}favorites=[];recent=[];theme='light';setTheme();toast('Saved data reset');settings()}}
function openSearch(initial=''){let overlay=$('#overlay');overlay.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="Search Obsidian"><div class="eyebrow">Search the collection</div><div style="margin:10px 0"><input class="field" id="modalSearch" placeholder="Try “calculator” or “JSON”…" value="${esc(initial)}" autocomplete="off"></div><div class="search-results" id="searchResults"></div><div class="muted" style="font-size:10px;margin-top:12px">Use ↑ ↓ to navigate · Enter to open · Esc to close</div></section></div>`;let input=$('#modalSearch'),results=$('#searchResults'),selected=0;const draw=()=>{let q=input.value.toLowerCase().trim();let found=catalog.filter(f=>!q||(f.name+' '+f.desc+' '+f.category+' '+f.keywords).toLowerCase().includes(q));results.innerHTML=found.length?found.map((f,i)=>`<div class="search-result" data-search-id="${f.id}" tabindex="0" style="${i===selected?'background:var(--accent-soft)':''}"><span><strong>${esc(f.icon)} &nbsp;${esc(f.name)}</strong><div class="result-cat">${esc(f.desc)}</div></span><span class="result-cat">${esc(f.category)}</span></div>`).join(''):'<div class="empty">No matching tools. Try another search.</div>';$$('[data-search-id]',results).forEach(x=>x.onclick=()=>{overlay.innerHTML='';openFeature(x.dataset.searchId)})};input.oninput=()=>{selected=0;draw()};input.onkeydown=e=>{let opts=$$('[data-search-id]',results);if(e.key==='ArrowDown'){e.preventDefault();selected=Math.min(selected+1,opts.length-1);draw()}if(e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,selected-1);draw()}if(e.key==='Enter'&&opts[selected])opts[selected].click();if(e.key==='Escape')overlay.innerHTML=''};overlay.onclick=e=>{if(e.target.classList.contains('modal-backdrop'))overlay.innerHTML=''};draw();input.focus()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}let feat=e.target.closest('[data-feature]');if(feat){openFeature(feat.dataset.feature);return}let fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();let id=fav.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];safeStore.set('favorites',favorites);toast(favorites.includes(id)?'Added to favorites':'Removed from favorites');render(activeView);return}let go=e.target.closest('[data-go]');if(go)navigate(go.dataset.go)});
$$('.nav-item').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#themeToggle').onclick=()=>{theme=theme==='dark'?'light':'dark';setTheme()};$('#favoritesBtn').onclick=()=>navigate('favorites');$('#searchOpen').onclick=()=>openSearch();$('#searchInput').onfocus=()=>openSearch($('#searchInput').value);$('#searchInput').onkeydown=e=>{if(e.key==='Enter')openSearch(e.currentTarget.value)};$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')$('#overlay').innerHTML=''});
setTheme();render('overview');
})();
</script>
